name: brew audit and install

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: audit, build-from-source install, brew test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Tap this checkout
        run: brew tap tensorplate/tap "$PWD"

      - name: Audit and style
        run: |
          brew audit --strict --online tensorplate/tap/tensorplate
          brew style tensorplate/tap

      - name: Install from source
        run: brew install --build-from-source tensorplate/tap/tensorplate

      - name: Test formula
        run: |
          brew test tensorplate/tap/tensorplate
          tensorplate version
